global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"

    static_configs:
      - targets:
        - localhost:9090

  - job_name: "user-service"
    metrics_path: /metrics

    static_configs:
      - targets:
        - 172.17.0.1:3001

  - job_name: "product-service"
    static_configs:
      - targets:
        - 172.17.0.1:3002
