global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
      - targets:
        - alertmanager:9093

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
        - prometheus:9090

  - job_name: "user-service"
    static_configs:
      - targets:
        - user-service:3001

  - job_name: "product-service"
    static_configs:
      - targets:
        - product-service:3002

  - job_name: "api-gateway"
    static_configs:
      - targets:
        - product-service:8080
